{% extends 'secretariat/base_secretariat.html' %}
{% block title %}Supprimer - Secrétariat{% endblock %}
{% block content %}
<div class="sec-topbar">
    <h4 class="mb-0"><i class="bi bi-trash"></i> Supprimer — {{ cfg.label }}</h4>
</div>
<div class="sec-card p-4">
    <p>Confirmez-vous la suppression de <strong>{{ objet }}</strong> ?</p>
    <p class="text-muted small">Cette action est irréversible.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Supprimer définitivement</button>
        <a href="{% url 'secretariat:liste' slug=slug %}" class="btn btn-outline-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
